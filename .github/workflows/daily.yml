# 每天北京时间 07:45 自动采集并发布看板 —— 完全不依赖本机是否开机。
# 启用前提：仓库 Settings → Pages → Source 选择 "GitHub Actions"。
name: 每日更新看板

on:
  schedule:
    - cron: "45 23 * * *"   # UTC 23:45 = 北京时间次日 07:45
  push:
    branches: [main]        # 本地 push（改代码/改登记库）后自动重新发布
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write            # 回写数据与页面
  pages: write
  id-token: write

concurrency:
  group: pigboard-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 防止自触发死循环：跳过本工作流自己产生的数据提交
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '看板数据更新')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集并生成看板（无变化时不会改写）
        run: python pipeline.py

      - name: 回写数据与页面
        run: |
          git config user.name  "pigboard-bot"
          git config user.email "pigboard-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "本次无数据变化，未提交。"
          else
            git commit -m "data: $(date -u '+%Y-%m-%d') 看板数据更新"
            git push
          fi

      - name: 上传静态站点（仅 web/ 目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
